name: Build DB-Robot APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # The native code (Opus, micro-features) needs the NDK and CMake on top of the SDK platform.
      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Rename APK
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | cut -d'"' -f2)
          mv app/build/outputs/apk/release/app-release.apk "DB-Robot-R1-v${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: DB-Robot-R1-APK
          path: DB-Robot-R1-v*.apk
